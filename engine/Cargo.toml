[package]
name = "mbuni-matching-engine"
version = "2.0.0"
edition = "2021"
description = "Mbuni CEX 2.0 — High-performance matching engine in Rust (Tokio + Tonic)"
license = "MIT"

[lib]
name = "mbuni_matching_engine"
path = "src/lib.rs"

[[bin]]
name = "mbuni-engine"
path = "src/main.rs"

[dependencies]
tonic = "0.12"
prost = "0.13"
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
dashmap = "6.1"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
uuid = { version = "1.10", features = ["v4"] }

[build-dependencies]
tonic-build = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
