# =============================================================================
# Mbuni CEX — Rust Matching Engine CI
#
# Scenarios:
#   - cargo check / clippy / test on every PR + push to main
#   - cargo fmt --check
#   - Release build verification
#   - Optional criterion benchmarks on schedule
# =============================================================================

name: Matching Engine (Rust)

on:
  push:
    branches: [main, master]
    paths:
      - "engine/**"
      - "proto/**"
      - ".github/workflows/engine.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "engine/**"
      - "proto/**"
      - ".github/workflows/engine.yml"
  schedule:
    - cron: "0 7 * * 1"  # weekly benchmarks
  workflow_dispatch:

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust-ci:
    name: Check · Clippy · Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: engine

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-features -- --nocapture

      - name: cargo build --release
        run: cargo build --release --all-features

  # ---------------------------------------------------------------------------
  # Optional: run on schedule or manual dispatch
  # ---------------------------------------------------------------------------
  benchmarks:
    name: Benchmarks
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Run criterion (if present)
        run: |
          if cargo bench --list 2>/dev/null | grep -q .; then
            cargo bench --all-features
          else
            echo "No criterion benchmarks defined yet — skipping"
          fi
