# =============================================================================
# Mbuni CEX — Release pipeline
#
# Triggered by version tags (v*.*.*) or manual dispatch.
# Creates GitHub Release, builds multi-arch images, attaches artifacts.
# =============================================================================

name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 2.0.1) — without the v prefix"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Resolved release: ${TAG}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1

      - name: Install & build frontend artifact
        run: |
          bun install --frozen-lockfile
          bun run db:generate
          NEXTAUTH_SECRET=release-placeholder DATABASE_URL=file:./db/release.db NEXTAUTH_URL=http://localhost:3000 bun run build
          tar -czf mbuni-cex-frontend-${{ steps.meta.outputs.version }}.tar.gz .next/standalone public

      - name: Build Rust engine binary
        working-directory: engine
        run: |
          rustup default stable
          cargo build --release --all-features
          cp target/release/matching_engine ../matching-engine-${{ steps.meta.outputs.version }}-linux-x64 || true
          # binary name may vary — fall back to any release binary
          ls -la target/release/ || true

      - name: Set up QEMU + Buildx (multi-arch)
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.meta.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.meta.outputs.version }}
            type=raw,value=latest

      - name: Build & push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Mbuni CEX ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' || contains(steps.meta.outputs.tag, '-rc') || contains(steps.meta.outputs.tag, '-beta') || contains(steps.meta.outputs.tag, '-alpha') }}
          files: |
            mbuni-cex-frontend-*.tar.gz
            matching-engine-*-linux-x64
          body: |
            ## Mbuni CEX ${{ steps.meta.outputs.tag }}

            ### Container images
            ```
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ```

            ### Quick start
            ```bash
            git checkout ${{ steps.meta.outputs.tag }}
            bun install && bun run db:push && bun run db:seed && bun run dev
            ```

            See [CHANGELOG.md](./CHANGELOG.md) for details.
