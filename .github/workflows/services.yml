# =============================================================================
# Mbuni CEX — Go Microservices CI
#
# Covers: trading, wallet, marketdata, compliance services
# =============================================================================

name: Go Services

on:
  push:
    branches: [main, master]
    paths:
      - "services/**"
      - "proto/**"
      - ".github/workflows/services.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "services/**"
      - "proto/**"
      - ".github/workflows/services.yml"
  workflow_dispatch:

concurrency:
  group: services-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-ci:
    name: Lint · Test · Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [trading, wallet, marketdata, compliance]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download modules
        run: |
          if [ -f go.mod ]; then
            go mod download
          else
            echo "No go.mod yet — skipping"
            exit 0
          fi

      - name: go vet
        run: |
          if [ -f go.mod ]; then
            go vet ./...
          fi

      - name: go test
        run: |
          if [ -f go.mod ]; then
            go test -race -coverprofile=coverage.out ./...
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage.out
          retention-days: 7
          if-no-files-found: ignore

      - name: go build
        run: |
          if [ -f go.mod ]; then
            go build -o /tmp/${{ matrix.service }} ./...
          fi

  # ---------------------------------------------------------------------------
  # Build multi-service Docker image (services/Dockerfile)
  # ---------------------------------------------------------------------------
  docker-services:
    name: Build Services Image
    needs: go-ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push services image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/services:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}/services:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
